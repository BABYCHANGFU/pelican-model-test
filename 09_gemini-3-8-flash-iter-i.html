<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑单车 2D 动画</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f4efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .stage {
      position: relative;
      width: 900px;
      max-width: 95vw;
      background: linear-gradient(180deg, #bfe3f7 0%, #eef7fc 65%, #d8ebbe 65%, #b9db9b 72%, #7fa873 72%, #688e5d 100%);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 动画定义 */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-0.5deg); }
    }
    @keyframes head-bob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(1deg); }
    }
    @keyframes pouch-wobble {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 1.08) skewX(2deg); }
    }
    @keyframes cloud-drift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    @keyframes road-dash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes roadside-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    @keyframes pedal-cycle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes leg-pump-near {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-24deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes leg-pump-far {
      0% { transform: rotate(-24deg); }
      50% { transform: rotate(0deg); }
      100% { transform: rotate(-24deg); }
    }
    @keyframes blink {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    /* 类关联 */
    .wheel-rotate {
      animation: spin 0.7s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .bike-body-group {
      animation: bobbing 0.35s ease-in-out infinite;
      transform-origin: 300px 380px;
    }
    .pelican-head {
      animation: head-bob 0.7s ease-in-out infinite;
      transform-origin: 470px 180px;
    }
    .pelican-pouch {
      animation: pouch-wobble 0.7s ease-in-out infinite;
      transform-origin: 520px 180px;
    }
    .pelican-eye {
      animation: blink 4s infinite;
      transform-origin: 495px 158px;
    }
    .crank-motion {
      animation: pedal-cycle 0.7s linear infinite;
      transform-origin: 410px 385px;
    }
    .pedal-counter {
      animation: spin-reverse 0.7s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .near-leg {
      animation: leg-pump-near 0.7s ease-in-out infinite;
      transform-origin: 360px 290px;
    }
    .far-leg {
      animation: leg-pump-far 0.7s ease-in-out infinite;
      transform-origin: 350px 288px;
    }
    .road-line {
      stroke-dasharray: 40 40;
      animation: road-dash 0.35s linear infinite;
    }
    .clouds-wrap {
      animation: cloud-drift 22s linear infinite;
    }
    .roadside-wrap {
      animation: roadside-move 3.2s linear infinite;
    }
  </style>
</head>
<body>

  <div class="stage">
    <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 轮毂与辐条样式 -->
        <g id="wheel">
          <circle cx="0" cy="0" r="64" fill="none" stroke="#2c3e50" stroke-width="9"/>
          <circle cx="0" cy="0" r="58" fill="none" stroke="#bdc3c7" stroke-width="4"/>
          <!-- 辐条 -->
          <line x1="-58" y1="0" x2="58" y2="0" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="0" y1="-58" x2="0" y2="58" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="-41" y1="-41" x2="41" y2="41" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="-41" y1="41" x2="41" y2="-41" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="-22" y1="-53.6" x2="22" y2="53.6" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="53.6" y1="-22" x2="-53.6" y2="22" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="-53.6" y1="-22" x2="53.6" y2="22" stroke="#95a5a6" stroke-width="1.8"/>
          <line x1="-22" y1="53.6" x2="22" y2="-53.6" stroke="#95a5a6" stroke-width="1.8"/>
          <!-- 轴心 -->
          <circle cx="0" cy="0" r="10" fill="#e74c3c"/>
          <circle cx="0" cy="0" r="4" fill="#ffffff"/>
        </g>

        <!-- 云朵图形 -->
        <g id="cloud">
          <path d="M 0 30 A 25 25 0 0 1 40 10 A 35 35 0 0 1 100 10 A 25 25 0 0 1 130 30 A 20 20 0 0 1 115 50 L 15 50 A 20 20 0 0 1 0 30 Z" fill="#ffffff" opacity="0.85"/>
        </g>

        <!-- 路边灌木/小草 -->
        <g id="bush">
          <path d="M 0 0 Q 8 -18 18 0 Q 28 -24 38 0 Q 48 -14 56 0 Z" fill="#4a7c39"/>
          <circle cx="18" cy="-5" r="3" fill="#f1c40f"/>
          <circle cx="38" cy="-8" r="3" fill="#e74c3c"/>
        </g>
      </defs>

      <!-- 远景：漂浮云朵（两组首尾循环） -->
      <g class="clouds-wrap">
        <use href="#cloud" x="50" y="40" transform="scale(1.1)"/>
        <use href="#cloud" x="380" y="70" transform="scale(0.8)"/>
        <use href="#cloud" x="720" y="30" transform="scale(1)"/>
        <use href="#cloud" x="950" y="40" transform="scale(1.1)"/>
        <use href="#cloud" x="1280" y="70" transform="scale(0.8)"/>
        <use href="#cloud" x="1620" y="30" transform="scale(1)"/>
      </g>

      <!-- 远景山丘 -->
      <path d="M-50 340 Q 180 250 420 340 T 950 340 L 950 380 L -50 380 Z" fill="#99c885" opacity="0.6"/>

      <!-- 路边树木/灌木快速后退（两组拼合循环） -->
      <g class="roadside-wrap">
        <!-- 第 1 屏 -->
        <use href="#bush" x="60" y="375"/>
        <use href="#bush" x="220" y="375" transform="scale(1.2) translate(0, -6)"/>
        <use href="#bush" x="480" y="375"/>
        <use href="#bush" x="760" y="375" transform="scale(1.3) translate(0, -8)"/>
        <!-- 第 2 屏 (接缝) -->
        <use href="#bush" x="960" y="375"/>
        <use href="#bush" x="1120" y="375" transform="scale(1.2) translate(0, -6)"/>
        <use href="#bush" x="1380" y="375"/>
        <use href="#bush" x="1660" y="375" transform="scale(1.3) translate(0, -8)"/>
      </g>

      <!-- 地面道路基底 -->
      <rect x="0" y="375" width="900" height="145" fill="#505a63"/>
      <!-- 路肩石 -->
      <rect x="0" y="375" width="900" height="9" fill="#8492a6"/>
      <!-- 道路白色中线（循环滚动虚线） -->
      <line class="road-line" x1="-100" y1="450" x2="1000" y2="450" stroke="#f1c40f" stroke-width="8" stroke-linecap="round"/>

      <!-- ================= 骑行主体（自行车 + 鹈鹕） ================= -->
      <g id="bicycle-and-rider">

        <!-- 地面阴影 -->
        <ellipse cx="400" cy="452" rx="260" ry="14" fill="#30373d" opacity="0.45"/>

        <!-- 后轮 (中心: 250, 385) -->
        <g transform="translate(250, 385)">
          <use href="#wheel" class="wheel-rotate"/>
        </g>

        <!-- 前轮 (中心: 570, 385) -->
        <g transform="translate(570, 385)">
          <use href="#wheel" class="wheel-rotate"/>
        </g>

        <!-- 颠簸震动的车身与骑手总成 -->
        <g class="bike-body-group">

          <!-- 远侧腿 (远侧脚踏) -->
          <g class="far-leg">
            <path d="M 350 288 L 385 345 L 395 365" fill="none" stroke="#e67e22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 远侧鸭蹼脚掌 -->
            <polygon points="380,365 410,365 400,378 375,375" fill="#d35400"/>
          </g>

          <!-- ====== 自行车车架管线 ====== -->
          <g stroke="#e74c3c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <!-- 后平叉 (后轴 250,385 -> 中轴 410,385) -->
            <line x1="250" y1="385" x2="410" y2="385"/>
            <!-- 后上叉 (后轴 250,385 -> 坐管三通 335,270) -->
            <line x1="250" y1="385" x2="335" y2="270"/>
            <!-- 立管 (中轴 410,385 -> 坐管三通 335,270) -->
            <line x1="410" y1="385" x2="335" y2="270"/>
            <!-- 下管 (中轴 410,385 -> 车头头管 520,240) -->
            <line x1="410" y1="385" x2="520" y2="240"/>
            <!-- 上管 (坐管三通 335,270 -> 车头头管 520,240) -->
            <line x1="335" y1="270" x2="520" y2="240"/>
            <!-- 前叉 (车头头管 520,240 -> 前轴 570,385) -->
            <line x1="520" y1="240" x2="570" y2="385"/>
          </g>

          <!-- 坐垫管与鞍座 -->
          <line x1="335" y1="270" x2="330" y2="245" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round"/>
          <path d="M 295 240 Q 330 235 365 245 C 375 248 375 255 360 255 L 305 255 C 295 255 290 248 295 240 Z" fill="#2c3e50"/>

          <!-- 车把立管与把手 -->
          <path d="M 520 240 L 515 190 Q 515 170 490 175" fill="none" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round"/>
          <!-- 车铃铛 -->
          <circle cx="510" cy="178" r="8" fill="#f1c40f"/>
          <rect x="502" y="184" width="6" height="4" fill="#7f8c8d"/>

          <!-- ====== 鹈鹕身体结构 ====== -->
          <!-- 尾羽 -->
          <path d="M 270 240 C 250 230 235 245 250 260 C 260 270 280 275 295 270 Z" fill="#cfd9df"/>
          
          <!-- 主躯干 -->
          <ellipse cx="345" cy="245" rx="55" ry="42" fill="#ecf0f1" transform="rotate(-15 345 245)"/>
          <!-- 肚皮阴影/羽毛反光 -->
          <path d="M 310 265 Q 350 295 385 260 Q 355 275 310 265 Z" fill="#bdc3c7"/>

          <!-- 优雅长脖子 -->
          <path d="M 370 230 C 390 220 425 210 440 180 C 450 160 455 140 470 135 C 485 130 495 140 485 160 C 475 180 445 230 395 250 Z" fill="#ecf0f1"/>

          <!-- 近侧腿与脚掌 (固定在脚踏位置做联动) -->
          <g class="near-leg">
            <!-- 大腿+小腿关节骨架 -->
            <path d="M 355 265 L 390 325 L 410 385" fill="none" stroke="#f39c12" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 鸭蹼大脚掌 -->
            <polygon points="390,380 435,375 425,395 385,395" fill="#e67e22"/>
          </g>

          <!-- 翅膀（向前搭在车把手上方） -->
          <path d="M 330 230 C 340 190 390 190 435 185 C 470 180 500 178 505 184 C 490 198 440 225 380 250 C 350 260 325 255 330 230 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
          <!-- 翅膀羽毛分层 -->
          <path d="M 400 205 C 440 195 480 188 495 188 C 470 202 430 220 380 235" fill="none" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>

          <!-- ====== 鹈鹕头部与大嘴 (带独立点头与囊袋抖动) ====== -->
          <g class="pelican-head">
            <!-- 后脑勺小冠毛/呆毛 -->
            <path d="M 465 115 Q 445 105 450 95 Q 465 110 475 120 Z" fill="#ecf0f1"/>
            <path d="M 460 125 Q 435 120 440 110 Q 460 120 470 130 Z" fill="#d5dbdb"/>

            <!-- 头部主体 -->
            <circle cx="485" cy="135" r="26" fill="#ffffff"/>

            <!-- 标志性的大嘴大喉囊 (Pelican Big Pouch) -->
            <!-- 巨大弹性下喉囊 -->
            <path class="pelican-pouch" d="M 500 148 C 505 175 515 215 565 210 C 625 205 660 165 675 142 L 500 148 Z" fill="#f39c12"/>
            <!-- 喉囊纹理/血管细线 -->
            <path d="M 525 155 Q 545 190 575 195" fill="none" stroke="#e67e22" stroke-width="2" opacity="0.6"/>
            <path d="M 565 155 Q 590 190 625 180" fill="none" stroke="#e67e22" stroke-width="2" opacity="0.6"/>

            <!-- 上长喙 (坚硬角质层 + 前端小弯钩) -->
            <path d="M 485 130 L 685 136 C 692 137 695 142 690 146 C 685 150 675 148 670 144 L 485 148 Z" fill="#f1c40f" stroke="#d68910" stroke-width="1.5"/>
            <!-- 嘴中缝线 -->
            <line x1="495" y1="144" x2="680" y2="142" stroke="#b7950b" stroke-width="2"/>

            <!-- 萌系大眼睛 -->
            <circle cx="493" cy="128" r="7" fill="#ffffff"/>
            <circle class="pelican-eye" cx="494" cy="128" r="4.5" fill="#2c3e50"/>
            <circle cx="496" cy="126" r="1.5" fill="#ffffff"/>

            <!-- 帅气骑行小帽子 (复古报童帽) -->
            <path d="M 465 125 C 465 105 500 100 515 118 L 535 122 C 538 124 535 128 528 127 L 505 124 Z" fill="#34495e"/>
            <circle cx="488" cy="106" r="3" fill="#e74c3c"/>
          </g>

          <!-- ====== 牙盘中轴与踏板组 ====== -->
          <!-- 链条与牙盘 (410, 385) -->
          <circle cx="410" cy="385" r="22" fill="#34495e"/>
          <circle cx="410" cy="385" r="17" fill="#7f8c8d"/>

          <!-- 旋转曲柄与脚踏 -->
          <g class="crank-motion">
            <!-- 近侧曲柄 -->
            <line x1="410" y1="385" x2="410" y2="420" stroke="#bdc3c7" stroke-width="7" stroke-linecap="round"/>
            <g transform="translate(410, 420)">
              <!-- 脚踏板 (反转保持水平) -->
              <rect class="pedal-counter" x="-12" y="-4" width="24" height="8" rx="3" fill="#2c3e50"/>
            </g>
            <!-- 远侧曲柄 (反向 180度) -->
            <line x1="410" y1="385" x2="410" y2="350" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
            <g transform="translate(410, 350)">
              <rect class="pedal-counter" x="-10" y="-3" width="20" height="6" rx="2" fill="#1a252f"/>
            </g>
          </g>

          <!-- 链条保护罩 -->
          <path d="M 250 385 L 410 375 C 425 375 435 385 430 395 L 250 392 Z" fill="none" stroke="#2c3e50" stroke-width="4" opacity="0.3"/>

        </g>
      </g>
    </svg>
  </div>

</body>
</html>
