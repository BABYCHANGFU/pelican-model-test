<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 2D 动画</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at center, #fdfbf7 0%, #e8e3d9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 900px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.08));
    }

    /* 动画系统定义 */
    /* 1. 车轮与辐条飞转 */
    .wheel-rotate {
      transform-origin: center;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 2. 地面与微风后退视差 */
    .ground-line {
      stroke-dasharray: 80 40;
      animation: moveRoad 0.8s linear infinite;
    }
    @keyframes moveRoad {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 120; }
    }

    .wind-dash {
      stroke-dasharray: 60 120;
      animation: windBlow 1.2s linear infinite;
    }
    @keyframes windBlow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 360; }
    }

    /* 3. 牙盘与脚踏踩动 */
    .crank-rotate {
      transform-origin: 400px 375px;
      animation: spin 1s linear infinite;
    }
    .pedal-counter-rotate {
      transform-origin: center;
      animation: spinReverse 1s linear infinite;
    }
    @keyframes spinReverse {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* 4. 鹈鹕身体与车架微颠簸 */
    .pelican-rider {
      animation: bikeBob 0.5s ease-in-out infinite alternate;
      transform-origin: 400px 380px;
    }
    @keyframes bikeBob {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(0.8deg); }
    }

    /* 5. 鹈鹕大嘴喉囊兜风与Q弹晃动 */
    .pouch-jiggle {
      transform-origin: 520px 180px;
      animation: pouchBob 0.6s ease-in-out infinite alternate;
    }
    @keyframes pouchBob {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.03, 0.98) rotate(-1.5deg); }
      100% { transform: scale(0.98, 1.02) rotate(1deg); }
    }

    /* 6. 兜里偷偷装的鱼尾巴拍打 */
    .fish-tail {
      transform-origin: 575px 190px;
      animation: tailFlap 0.35s ease-in-out infinite alternate;
    }
    @keyframes tailFlap {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(20deg); }
    }

    /* 7. 鹈鹕眨眼 */
    .pelican-eye {
      transform-origin: 495px 145px;
      animation: blink 3.2s infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* 8. 腿部随踩踏自然伸缩联动 */
    .leg-front {
      animation: pedalLegFront 1s linear infinite;
    }
    .leg-back {
      animation: pedalLegBack 1s linear infinite;
    }
    @keyframes pedalLegFront {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(14px, 14px); }
      50%  { transform: translate(0, 28px); }
      75%  { transform: translate(-14px, 14px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes pedalLegBack {
      0%   { transform: translate(0, 28px); }
      25%  { transform: translate(-14px, 14px); }
      50%  { transform: translate(0, 0); }
      75%  { transform: translate(14px, 14px); }
      100% { transform: translate(0, 28px); }
    }

    .badge {
      margin-top: 15px;
      font-size: 13px;
      color: #8b8374;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 轮胎纹理与渐变 -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#def2ff" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#ebe7de"/>
        </linearGradient>

        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fdbb2d"/>
          <stop offset="100%" stop-color="#e88a1a"/>
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fca858"/>
          <stop offset="100%" stop-color="#f37c56"/>
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2a9d8f"/>
          <stop offset="100%" stop-color="#1f6f65"/>
        </linearGradient>

        <!-- 车轮组件模板 (带辐条) -->
        <g id="bicycle-wheel">
          <!-- 轮胎外圈与胎纹 -->
          <circle cx="0" cy="0" r="68" fill="none" stroke="#2b2d42" stroke-width="10"/>
          <circle cx="0" cy="0" r="62" fill="none" stroke="#e0ded8" stroke-width="2"/>
          <circle cx="0" cy="0" r="58" fill="none" stroke="#8d99ae" stroke-width="3"/>
          <!-- 辐条旋转层 -->
          <g class="wheel-rotate">
            <line x1="-58" y1="0" x2="58" y2="0" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="0" y1="-58" x2="0" y2="58" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-41" y1="-41" x2="41" y2="41" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-41" y1="41" x2="41" y2="-41" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-53.5" y1="-22.2" x2="53.5" y2="22.2" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-22.2" y1="-53.5" x2="22.2" y2="53.5" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-53.5" y1="22.2" x2="53.5" y2="-22.2" stroke="#a0aab8" stroke-width="1.5"/>
            <line x1="-22.2" y1="53.5" x2="22.2" y2="-53.5" stroke="#a0aab8" stroke-width="1.5"/>
            <!-- 气嘴 -->
            <rect x="42" y="-3" width="7" height="6" fill="#f8961e" rx="1.5"/>
          </g>
          <!-- 轴心花鼓 -->
          <circle cx="0" cy="0" r="11" fill="#2b2d42"/>
          <circle cx="0" cy="0" r="5" fill="#edf2f4"/>
        </g>
      </defs>

      <!-- 天空微风视差线 -->
      <path class="wind-dash" d="M 50 80 Q 250 70, 450 85 T 850 75" fill="none" stroke="#d5e8f5" stroke-width="3" stroke-linecap="round"/>
      <path class="wind-dash" d="M -50 120 Q 180 115, 380 125 T 780 115" fill="none" stroke="#e0eef8" stroke-width="2" stroke-linecap="round" style="animation-duration: 1.5s;"/>
      <path class="wind-dash" d="M 120 170 Q 320 160, 520 175 T 900 165" fill="none" stroke="#e6f1f8" stroke-width="2.5" stroke-linecap="round" style="animation-duration: 0.9s;"/>

      <!-- 地面跑道 -->
      <g>
        <!-- 主地面 -->
        <line x1="-50" y1="448" x2="850" y2="448" stroke="#5c677d" stroke-width="3" stroke-linecap="round"/>
        <!-- 飞速滑退的地面标线 -->
        <line class="ground-line" x1="-50" y1="462" x2="850" y2="462" stroke="#a0aab8" stroke-width="5" stroke-linecap="round"/>
        <line class="ground-line" x1="-30" y1="475" x2="850" y2="475" stroke="#d3d7de" stroke-width="3" stroke-linecap="round" style="animation-duration: 0.5s;"/>
        <!-- 小石子掠影 -->
        <circle cx="180" cy="455" r="2.5" fill="#8d99ae"/>
        <circle cx="430" cy="457" r="2" fill="#8d99ae"/>
        <circle cx="680" cy="454" r="3" fill="#8d99ae"/>
      </g>

      <!-- 动态主体群组 (车 + 鸟整体) -->
      <g class="pelican-rider">

        <!-- 阴影 -->
        <ellipse cx="400" cy="448" rx="200" ry="12" fill="rgba(30, 41, 59, 0.14)"/>

        <!-- ================= 车体结构层 (底层：后轮 & 后腿) ================= -->

        <!-- 后轮 (X: 250, Y: 380) -->
        <use href="#bicycle-wheel" x="250" y="380"/>

        <!-- 远侧踏板与后腿 (背侧阴影层) -->
        <g opacity="0.6">
          <g class="leg-back">
            <!-- 大腿骨 -->
            <path d="M 335 285 Q 365 315, 385 360" fill="none" stroke="#e08020" stroke-width="6" stroke-linecap="round"/>
            <!-- 鸭蹼踩在背侧脚踏 -->
            <path d="M 375 365 L 400 370 L 385 378 Z" fill="#c06010"/>
          </g>
        </g>

        <!-- ================= 自行车车架 ================= -->
        <g id="bike-frame">
          <!-- 链条 -->
          <line x1="250" y1="380" x2="400" y2="375" stroke="#333" stroke-width="4" stroke-dasharray="4 2"/>
          <line x1="250" y1="380" x2="400" y2="385" stroke="#333" stroke-width="4" stroke-dasharray="4 2"/>

          <!-- 经典复古双三角车架 -->
          <!-- 后平叉 (后轴 250,380 -> 五通 400,380) -->
          <line x1="250" y1="380" x2="400" y2="380" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
          <!-- 后上叉 (后轴 250,380 -> 坐管结 325,270) -->
          <line x1="250" y1="380" x2="325" y2="270" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
          <!-- 立管 (五通 400,380 -> 坐管结 325,270) -->
          <line x1="400" y1="380" x2="325" y2="270" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
          <!-- 下管 (五通 400,380 -> 头管 520,250) -->
          <line x1="400" y1="380" x2="520" y2="250" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
          <!-- 上管 (坐管结 325,270 -> 头管 520,250) -->
          <line x1="325" y1="270" x2="520" y2="250" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
          <!-- 前叉 (头管 520,250 -> 前轴 550,380) -->
          <line x1="520" y1="250" x2="550" y2="380" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>

          <!-- 车座与坐杆 -->
          <line x1="325" y1="270" x2="320" y2="248" stroke="#8d99ae" stroke-width="6" stroke-linecap="round"/>
          <!-- 皮革复古坐垫 -->
          <path d="M 295 246 C 300 240, 335 240, 345 246 C 345 252, 325 255, 305 253 Z" fill="#6a4c38"/>
          <!-- 坐垫弹簧 -->
          <path d="M 305 253 Q 308 260, 313 253" fill="none" stroke="#2b2d42" stroke-width="3"/>

          <!-- 车把与立管 -->
          <line x1="520" y1="250" x2="515" y2="215" stroke="#8d99ae" stroke-width="6" stroke-linecap="round"/>
          <!-- 弯曲车把手 -->
          <path d="M 515 215 Q 500 200, 485 208" fill="none" stroke="#2b2d42" stroke-width="7" stroke-linecap="round"/>
          <!-- 车铃铛 -->
          <circle cx="505" cy="205" r="5" fill="#fdbb2d"/>

          <!-- 复古前车灯 -->
          <path d="M 532 238 L 546 232 L 546 248 Z" fill="#f8961e"/>
          <ellipse cx="546" cy="240" rx="3" ry="8" fill="#ffef9f"/>
          <!-- 灯光微弱光锥 -->
          <polygon points="549,235 630,220 630,260 549,245" fill="#ffef9f" opacity="0.25"/>
        </g>

        <!-- 前轮 (X: 550, Y: 380) 放在前叉之上/同级 -->
        <use href="#bicycle-wheel" x="550" y="380"/>

        <!-- 挡泥板 -->
        <path d="M 230 380 A 70 70 0 0 1 305 320" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
        <path d="M 525 320 A 70 70 0 0 1 575 380" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>

        <!-- 牙盘五通与旋转脚踏 (中央传动轴) -->
        <g>
          <!-- 大齿盘 -->
          <circle cx="400" cy="375" r="22" fill="#2b2d42"/>
          <circle cx="400" cy="375" r="16" fill="#8d99ae" stroke="#2b2d42" stroke-width="3"/>

          <!-- 牙盘曲柄 (连动旋转) -->
          <g class="crank-rotate">
            <!-- 近侧曲柄臂 -->
            <line x1="400" y1="375" x2="400" y2="340" stroke="#edf2f4" stroke-width="6" stroke-linecap="round"/>
            <line x1="400" y1="375" x2="400" y2="410" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
            <!-- 近侧踏板轴 -->
            <circle cx="400" cy="340" r="5" fill="#d90429"/>
            <rect x="388" y="337" width="24" height="6" rx="2" fill="#111" class="pedal-counter-rotate"/>
            <!-- 远侧踏板轴 -->
            <circle cx="400" cy="410" r="4" fill="#333"/>
            <rect x="388" y="407" width="24" height="6" rx="2" fill="#222" class="pedal-counter-rotate"/>
          </g>
          <!-- 中轴螺母 -->
          <circle cx="400" cy="375" r="6" fill="#edf2f4"/>
        </g>

        <!-- ================= 核心主角：大鹈鹕！ ================= -->
        <g id="pelican">

          <!-- 翘起的可爱尾羽 -->
          <path d="M 260 215 C 245 205, 235 220, 250 232 C 240 235, 245 248, 265 245 Z" fill="#d8d3c5"/>

          <!-- 鹈鹕丰满圆滚的身躯 (坐在坐垫上) -->
          <path d="M 265 240 
                   C 260 210, 290 180, 335 185 
                   C 375 190, 405 210, 400 260 
                   C 395 285, 360 295, 310 290 
                   C 280 288, 268 265, 265 240 Z" 
                fill="url(#bodyGrad)"/>

          <!-- 鹈鹕 S 型长脖子与后脑勺 -->
          <path d="M 360 195 
                   C 385 180, 405 150, 420 125 
                   C 430 110, 445 105, 465 110 
                   C 485 115, 495 130, 490 150 
                   C 480 175, 435 215, 395 225 Z" 
                fill="url(#bodyGrad)"/>

          <!-- 头顶呆毛 / 冠羽 (随风微微飘拂感) -->
          <path d="M 465 108 Q 455 92, 445 96 Q 458 104, 468 106 Z" fill="#e3ded2"/>
          <path d="M 470 106 Q 465 88, 452 90 Q 462 100, 472 105 Z" fill="#c9c3b4"/>

          <!-- 鹈鹕眼部 -->
          <g>
            <ellipse cx="496" cy="138" rx="8" ry="8" fill="#ffffff"/>
            <!-- 眨眼小眼珠 -->
            <g class="pelican-eye">
              <circle cx="498" cy="138" r="4.5" fill="#2b2d42"/>
              <circle cx="500" cy="136" r="1.5" fill="#ffffff"/> <!-- 高光点 -->
            </g>
            <!-- 萌系腮红 -->
            <ellipse cx="485" cy="150" rx="6" ry="3.5" fill="#ff758f" opacity="0.45"/>
          </g>

          <!-- 巨大招牌下嘴囊 (喉囊 Pouch) - 带Q弹晃动 -->
          <g class="pouch-jiggle">
            <!-- 喉囊主体口袋 (兜风鼓鼓囊囊) -->
            <path d="M 495 155 
                     C 540 160, 620 155, 625 160 
                     C 625 170, 605 240, 520 235 
                     C 475 230, 455 190, 475 168 Z" 
                  fill="url(#pouchGrad)"/>

            <!-- 喉囊上的天然纹理褶皱 -->
            <path d="M 505 175 Q 540 215, 575 185" fill="none" stroke="#e06940" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
            <path d="M 525 178 Q 550 225, 595 178" fill="none" stroke="#e06940" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

            <!-- 喜感彩蛋：嘴巴兜里装的一条扑腾的小鱼！ -->
            <g class="fish-tail">
              <!-- 伸出大嘴的小鱼尾巴 -->
              <path d="M 570 168 L 595 158 C 602 150, 610 152, 608 162 C 606 170, 600 172, 595 168 Z" fill="#4ea8de"/>
              <path d="M 595 168 C 602 170, 608 178, 604 186 C 596 186, 592 178, 588 172 Z" fill="#48cae4"/>
              <!-- 鱼鳍小花纹 -->
              <line x1="592" y1="165" x2="602" y2="160" stroke="#0077b6" stroke-width="1.2"/>
              <line x1="590" y1="168" x2="600" y2="178" stroke="#0077b6" stroke-width="1.2"/>
            </g>

            <!-- 标志性长上喙 (长嘴顶盖 + 尖钩) -->
            <path d="M 488 142 
                     L 630 152 
                     Q 638 153, 635 158 
                     L 626 163 
                     L 485 156 Z" 
                  fill="url(#beakGrad)"/>
            <!-- 嘴尖标志性向下小倒钩 -->
            <path d="M 632 153 Q 637 155, 634 162 Q 628 162, 629 157 Z" fill="#c05621"/>
            <!-- 鼻孔小线 -->
            <line x1="510" y1="147" x2="520" y2="148" stroke="#b7791f" stroke-width="1.5" stroke-linecap="round"/>
          </g>

          <!-- 鹈鹕翅膀 (像人类手臂一样扶着车把) -->
          <g>
            <!-- 翅膀大臂与主羽 -->
            <path d="M 330 205 
                     C 350 200, 420 220, 470 212 
                     C 485 210, 492 216, 480 225 
                     C 440 245, 360 250, 320 235 Z" 
                  fill="#ffffff" stroke="#e0ded6" stroke-width="1.5"/>
            <!-- 翅膀羽毛分层质感 -->
            <path d="M 350 218 C 390 228, 440 228, 465 220" fill="none" stroke="#d5d0c2" stroke-width="2" stroke-linecap="round"/>
            <path d="M 360 230 C 400 238, 435 236, 455 228" fill="none" stroke="#d5d0c2" stroke-width="2" stroke-linecap="round"/>
            <!-- 握在车把上的羽翼尖端 (像小手套) -->
            <ellipse cx="478" cy="214" rx="7" ry="5" fill="#f4f1ea" transform="rotate(-15 478 214)"/>
          </g>

          <!-- 近侧大腿与橘色大脚蹼 (踩在前踏板上) -->
          <g class="leg-front">
            <!-- 结实的大腿肉 -->
            <path d="M 320 270 Q 335 300, 360 308" fill="none" stroke="#f1eeea" stroke-width="14" stroke-linecap="round"/>
            <!-- 橙色鸟小腿 -->
            <line x1="355" y1="305" x2="395" y2="335" stroke="#f77f00" stroke-width="6" stroke-linecap="round"/>
            <!-- 鸭蹼大脚丫 (踩紧踏板随动) -->
            <path d="M 385 333 L 415 336 L 405 348 L 380 342 Z" fill="#f77f00"/>
            <circle cx="395" cy="336" r="3" fill="#d62828"/>
          </g>

          <!-- 骑行风镜/酷酷小领结 (点睛趣味配饰) -->
          <g>
            <!-- 飘扬在脑后的红领巾/飘带 -->
            <path d="M 430 185 Q 400 180, 385 168 Q 405 188, 428 192 Z" fill="#e63946"/>
            <path d="M 428 186 Q 395 195, 375 190 Q 400 198, 426 193 Z" fill="#d90429"/>
            <circle cx="430" cy="188" r="4.5" fill="#c1121f"/>
          </g>

        </g> <!-- end pelican -->

      </g> <!-- end pelican-rider -->

      <!-- 前景飞掠的风叶/落叶增加速度感 -->
      <g>
        <path d="M 820 320 Q 750 330, 710 315" fill="none" stroke="#a8dadc" stroke-width="2" opacity="0.6"/>
        <path d="M 860 410 Q 790 415, 750 405" fill="none" stroke="#a8dadc" stroke-width="2" opacity="0.5"/>
      </g>
    </svg>

    <div class="badge">🚲 鹈鹕骑行 2D SVG · 原生 CSS 驱动无依赖</div>
  </div>

</body>
</html>
