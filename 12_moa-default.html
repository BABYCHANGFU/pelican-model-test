<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鹈鹕骑自行车 2D 动画</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #11161f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .stage-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #88c9eb;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* 速度感地面流动 */
    @keyframes moveRoad {
      0% { transform: translateX(0); }
      100% { transform: translateX(-120px); }
    }
    .road-dashes {
      animation: moveRoad 0.4s linear infinite;
    }
    /* 远景云朵移动 */
    @keyframes moveClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    .cloud-layer {
      animation: moveClouds 20s linear infinite;
    }
    /* 围巾飘动 */
    @keyframes scarfWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg) scaleY(0.9); }
    }
    .scarf-tail {
      transform-origin: 395px 230px;
      animation: scarfWave 0.25s ease-in-out infinite alternate;
    }
    /* 喉囊抖动 (鹈鹕特色弹性大喉囊) */
    @keyframes pouchJiggle {
      0% { transform: scale(1) skewX(0deg); }
      50% { transform: scale(1.04, 0.96) skewX(-2deg); }
      100% { transform: scale(0.98, 1.03) skewX(1deg); }
    }
    .pelican-pouch {
      transform-origin: 520px 200px;
      animation: pouchJiggle 0.3s ease-in-out infinite;
    }
    /* 眨眼 */
    @keyframes blinkEye {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .pelican-eye {
      transform-origin: 485px 175px;
      animation: blinkEye 3.5s infinite;
    }
    /* 控制栏 */
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      color: #94a3b8;
      font-size: 13px;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      border-color: #475569;
    }
  </style>
</head>
<body>

  <script>
    // ================= 动画解算核心脚本 =================
    // 机械与鸟类几何参数
    const CRANK_CENTER = { x: 490, y: 415 };
    const CRANK_RADIUS = 32;
    const HIP_BASE = { x: 442, y: 285 }; // 鹈鹕髋关节锚点
    const THIGH_LEN = 75; // 大腿长
    const SHIN_LEN = 75;  // 小腿长

    // 元素引用
    const rearSpokes = document.getElementById('rearSpokes');
    const frontSpokes = document.getElementById('frontSpokes');
    const frontCrank = document.getElementById('frontCrank');
    const backCrank = document.getElementById('backCrank');
    const frontPedal = document.getElementById('frontPedal');
    const backPedal = document.getElementById('backPedal');
    const frontLeg = document.getElementById('frontLeg');
    const backLeg = document.getElementById('backLeg');
    const frontFoot = document.getElementById('frontFoot');
    const backFoot = document.getElementById('backFoot');
    const pelicanRider = document.getElementById('pelicanRider');
    const groundShadow = document.getElementById('groundShadow');
    const speedLines = document.getElementById('speedLines');

    let angle = 0;
    let speed = 1.2;
    let isPlaying = true;
    let lastTime = performance.now();

    // 双连杆反向运动学 (IK) 解算器: 根据髋部与踏板位置求膝关节
    function solveKnee(hip, pedal) {
      const dx = pedal.x - hip.x;
      const dy = pedal.y - hip.y;
      let d = Math.hypot(dx, dy);
      
      // 防止奇异点拉脱
      const maxReach = THIGH_LEN + SHIN_LEN - 0.01;
      if (d > maxReach) d = maxReach;
      if (d < 1) d = 1;

      const a = (THIGH_LEN * THIGH_LEN - SHIN_LEN * SHIN_LEN + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, THIGH_LEN * THIGH_LEN - a * a));

      // 沿连线的单位向量
      const ex = dx / d;
      const ey = dy / d;

      // 膝关节向前曲折 (法向量为 (ey, -ex))
      const kneeX = hip.x + a * ex + h * ey;
      const kneeY = hip.y + a * ey - h * ex;

      return { x: kneeX, y: kneeY };
    }

    // 绘制脚蹼 (三趾微弯水禽蹼)
    function getWebbedFootPoints(pedalX, pedalY, angleOffset) {
      // 踏板上的基准踏点
      const toeTip1 = `${pedalX + 22},${pedalY - 1}`;
      const toeTip2 = `${pedalX + 26},${pedalY + 5}`;
      const toeTip3 = `${pedalX + 18},${pedalY + 7}`;
      const heel = `${pedalX - 8},${pedalY + 2}`;
      return `${heel} ${pedalX + 5},${pedalY - 2} ${toeTip1} ${pedalX + 14},${pedalY + 2} ${toeTip2} ${pedalX + 12},${pedalY + 6} ${toeTip3} ${pedalX},${pedalY + 4}`;
    }

    function animate(currentTime) {
      if (!isPlaying) {
        lastTime = currentTime;
        requestAnimationFrame(animate);
        return;
      }

      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      // 累加旋转角度
      angle += speed * 4.5 * dt;

      // 1. 车轮辐条持续旋转 (与车速同步)
      const wheelDeg = (angle * 180 / Math.PI) % 360;
      rearSpokes.setAttribute('transform', `rotate(${wheelDeg})`);
      frontSpokes.setAttribute('transform', `rotate(${wheelDeg})`);

      // 2. 身体骑行动态起伏 (每踩踏半周起伏一次，极具生物韵律)
      const bobY = Math.sin(angle * 2) * 4.5;
      const tiltDeg = Math.cos(angle * 2) * 1.5;
      pelicanRider.setAttribute('transform', `translate(0, ${bobY}) rotate(${tiltDeg}, 440, 280)`);

      // 投影随起伏微弱呼吸
      const shadowScale = 1 - (bobY / 70);
      groundShadow.setAttribute('transform', `scale(${shadowScale}, 1) translate(${(1 - shadowScale) * 500}, 0)`);

      // 动态速度线晃动
      const speedOffset = (Math.sin(angle * 4) * 12);
      speedLines.setAttribute('transform', `translate(${speedOffset}, 0)`);

      // 3. 计算两侧脚踏实时位置 (相位差 180 度)
      const frontPedalPos = {
        x: CRANK_CENTER.x + CRANK_RADIUS * Math.cos(angle),
        y: CRANK_CENTER.y + CRANK_RADIUS * Math.sin(angle)
      };
      const backPedalPos = {
        x: CRANK_CENTER.x + CRANK_RADIUS * Math.cos(angle + Math.PI),
        y: CRANK_CENTER.y + CRANK_RADIUS * Math.sin(angle + Math.PI)
      };

      // 更新曲柄与踏板
      frontCrank.setAttribute('x2', frontPedalPos.x);
      frontCrank.setAttribute('y2', frontPedalPos.y);
      frontPedal.setAttribute('x', frontPedalPos.x - 15);
      frontPedal.setAttribute('y', frontPedalPos.y - 3);

      backCrank.setAttribute('x2', backPedalPos.x);
      backCrank.setAttribute('y2', backPedalPos.y);
      backPedal.setAttribute('x', backPedalPos.x - 14);
      backPedal.setAttribute('y', backPedalPos.y - 3);

      // 4. 计算腿部与膝关节坐标 (髋部跟随身体 bobY 上下运动)
      const currentHip = { x: HIP_BASE.x, y: HIP_BASE.y + bobY };

      // 前侧腿
      const frontKnee = solveKnee(currentHip, frontPedalPos);
      frontLeg.setAttribute('d', `M ${currentHip.x} ${currentHip.y} Q ${frontKnee.x} ${frontKnee.y} ${frontPedalPos.x} ${frontPedalPos.y}`);
      frontFoot.setAttribute('points', getWebbedFootPoints(frontPedalPos.x, frontPedalPos.y, 0));

      // 后侧腿 (稍微偏移一点透视)
      const backHip = { x: currentHip.x - 6, y: currentHip.y - 2 };
      const backKnee = solveKnee(backHip, backPedalPos);
      backLeg.setAttribute('d', `M ${backHip.x} ${backHip.y} Q ${backKnee.x} ${backKnee.y} ${backPedalPos.x} ${backPedalPos.y}`);
      backFoot.setAttribute('points', getWebbedFootPoints(backPedalPos.x, backPedalPos.y, 0));

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // 控制器交互
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      toggleBtn.textContent = isPlaying ? '暂停' : '继续播放';
    });

    const speedSlider = document.getElementById('speedSlider');
    speedSlider.addEventListener('input', (e) => {
      speed = parseFloat(e.target.value);
      // 同时调速 CSS 背景动画
      const duration = 0.4 / (speed / 1.2);
      document.querySelector('.road-dashes').style.animationDuration = `${duration}s`;
    });
  </script>
</body>
</html>
