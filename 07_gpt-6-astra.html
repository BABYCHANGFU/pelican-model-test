xt-align:center;margin-top:26px}@media(max-width:600px){body{padding:20px 12px}.edition{display:none}.card{border-radius:18px}.intro{top:6%}.intro p{max-width:180px}.badge{width:45px;height:45px;font-size:6px}.badge b{font-size:15px}header{margin-bottom:18px}.controls{gap:14px;margin-top:17px}.note{font-size:10px}button{padding:11px 15px}footer{font-size:8px}.eyebrow{font-size:8px}h1{margin:7px 0}}

<div class="controls"><div class="buttons"><button id="pause" type="button" aria-pressed="false">Ⅱ 暂停骑行</button><button id="speed" type="button" aria-label="切换骑行速度">速度 · 1×</button></div><div class="note"><span class="dot"></span>纯 SVG 动画 · 离线也有海风</div></div>
<footer>TAKE THE SCENIC ROUTE &nbsp; / &nbsp; 把日子骑成一阵风</footer>
</main>
<script>
'use strict';
const el=id=>document.getElementById(id);
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed=1,time=0,last=null;
const pauseButton=el('pause');
function updateButton(){pauseButton.textContent=paused?'▶ 继续骑行':'Ⅱ 暂停骑行';pauseButton.setAttribute('aria-pressed',String(paused));}
updateButton();
pauseButton.addEventListener('click',()=>{paused=!paused;updateButton();});
el('speed').addEventListener('click',()=>{speed=speed===1?1.5:speed===1.5?.65:1;el('speed').textContent=`速度 · ${speed}×`;});
function leg(prefix,angle,hipX,hipY,bend){
 const x=499+31*Math.cos(angle),y=542+31*Math.sin(angle);
 const dx=x-hipX,dy=y-hipY,d=Math.hypot(dx,dy);
 const a=90,b=90,along=(a*a-b*b+d*d)/(2*d);
 const h=Math.sqrt(Math.max(0,a*a-along*along));
 const kneeX=hipX+dx*along/d+bend*dy*h/d;
 const kneeY=hipY+dy*along/d-bend*dx*h/d;
 el(prefix+'Leg').setAttribute('d',`M${hipX} ${hipY} Q${kneeX-8} ${kneeY-4} ${kneeX} ${kneeY} L${x} ${y-8}`);
 el(prefix+'Foot').setAttribute('d',`M${x-5} ${y-12} Q${x+2} ${y-13} ${x+7} ${y-5} L${x+22} ${y-1} L${x+16} ${y+4} L${x-10} ${y+3}Z`);
 el(prefix==='near'?'pedalNear':'pedalFar').setAttribute('transform',`translate(${x} ${y+4})`);
}
function draw(){
 const angle=time*2.8,deg=angle*180/Math.PI;
 el('rearSpokes').setAttribute('transform',`rotate(${deg})`);
 el('frontSpokes').setAttribute('transform',`rotate(${deg})`);
 el('crank').setAttribute('transform',`translate(499 542) rotate(${deg})`);
 leg('far',angle+Math.PI,452,398,-1);
 leg('near',angle,469,400,1);
 const bob=Math.sin(angle*2)*1.8;
 el('rider').setAttribute('transform',`translate(0 ${bob})`);
 el('shadow').setAttribute('rx',217+bob*1.5);
 el('roadmarks').setAttribute('patternTransform',`translate(${-time*230%180} 0)`);
 el('waves').setAttribute('patternTransform',`translate(${-time*21%180} 0)`);
 el('clouds').setAttribute('transform',`translate(${-time*7%1000} 0)`);
 el('ground').setAttribute('transform',`translate(${-time*135%1100} 0)`);
 el('boat').setAttribute('transform',`translate(${Math.sin(time*.4)*9} ${Math.sin(time*1.3)*2})`);
 el('gulls').setAttribute('transform',`translate(${Math.sin(time*.3)*18} ${Math.sin(time)*4})`);
 const flutter=Math.sin(time*7)*7;
 el('scarfTail').setAttribute('d',`M511 320Q477 ${322+flutter} 455 ${294+flutter}L447 ${310+flutter}L434 ${303+flutter}Q461 ${346+flutter} 512 332Z`);
}
// ponytail: 重用 SVG 草丛形成连续路边循环，不引入动画库。
const secondGround=el('ground').cloneNode(true);secondGround.id='groundCopy';el('ground').after(secondGround);
const secondClouds=el('clouds').cloneNode(true);secondClouds.id='cloudsCopy';el('clouds').after(secondClouds);
function frame(now){
 if(last!==null&&!paused)time+=Math.min((now-last)/1000,.05)*speed;
 last=now;draw();
 secondGround.setAttribute('transform',`translate(${1100-time*135%1100} 0)`);
 secondClouds.setAttribute('transform',`translate(${1000-time*7%1000} 0)`);
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=null;});
requestAnimationFrame(frame);
</script>
</body>
