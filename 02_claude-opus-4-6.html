<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 70%, #7BC67E 70%, #5DA85D 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  svg { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 地面纹理 -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5335"/>
    </linearGradient>
    <!-- 云朵 -->
    <filter id="cloudShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 - 天空已由CSS处理 -->
  <!-- 远山 -->
  <path d="M0 340 Q100 280 200 320 Q300 260 400 310 Q500 270 600 300 Q700 250 800 330 L800 380 L0 380Z" fill="#6B8E5A" opacity="0.5"/>

  <!-- 云朵 -->
  <g filter="url(#cloudShadow)">
    <g>
      <ellipse cx="150" cy="80" rx="60" ry="25" fill="white" opacity="0.9"/>
      <ellipse cx="180" cy="70" rx="40" ry="20" fill="white" opacity="0.9"/>
      <ellipse cx="120" cy="75" rx="35" ry="18" fill="white" opacity="0.9"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;80,0;0,0" dur="20s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="550" cy="60" rx="50" ry="22" fill="white" opacity="0.85"/>
      <ellipse cx="580" cy="50" rx="35" ry="18" fill="white" opacity="0.85"/>
      <ellipse cx="520" cy="55" rx="30" ry="15" fill="white" opacity="0.85"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-60,0;0,0" dur="25s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="350" cy="100" rx="45" ry="20" fill="white" opacity="0.8"/>
      <ellipse cx="380" cy="92" rx="30" ry="15" fill="white" opacity="0.8"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;50,5;0,0" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 太阳 -->
  <circle cx="680" cy="70" r="40" fill="#FFD700" opacity="0.9">
    <animate attributeName="r" values="40;43;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="70" r="50" fill="#FFD700" opacity="0.2">
    <animate attributeName="r" values="50;58;50" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 地面 -->
  <rect x="0" y="370" width="800" height="130" fill="url(#groundGrad)"/>
  <!-- 路面 -->
  <rect x="0" y="370" width="800" height="40" fill="#555" rx="2"/>
  <!-- 路面虚线 -->
  <g>
    <line x1="0" y1="390" x2="50" y2="390" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,15"/>
    <line x1="0" y1="390" x2="800" y2="390" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,15">
      <animate attributeName="stroke-dashoffset" values="0;-35" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 小草装饰 -->
  <g fill="#4A7A3A">
    <path d="M50 370 Q52 355 55 370"/>
    <path d="M53 370 Q58 350 60 370"/>
    <path d="M150 370 Q152 358 155 370"/>
    <path d="M250 370 Q255 352 258 370"/>
    <path d="M253 370 Q260 348 263 370"/>
    <path d="M450 370 Q452 356 455 370"/>
    <path d="M650 370 Q655 350 658 370"/>
    <path d="M653 370 Q660 345 663 370"/>
    <path d="M750 370 Q752 358 755 370"/>
  </g>

  <!-- ========== 主角：鹈鹕+自行车组合 ========== -->
  <g>
    <!-- 整体左右循环移动 -->
    <animateTransform attributeName="transform" type="translate"
      values="-100,0;850,0" dur="10s" repeatCount="indefinite"/>

    <!-- 轻微上下颠簸 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,0;0,-2;0,0" dur="0.6s" repeatCount="indefinite"/>

      <!-- ===== 自行车 ===== -->
      <g>
        <!-- 后轮 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 300 365;360 300 365" dur="0.8s" repeatCount="indefinite"/>
          <circle cx="300" cy="365" r="28" fill="none" stroke="#333" stroke-width="3"/>
          <!-- 辐条 -->
          <line x1="300" y1="337" x2="300" y2="393" stroke="#666" stroke-width="1.5"/>
          <line x1="272" y1="365" x2="328" y2="365" stroke="#666" stroke-width="1.5"/>
          <line x1="280" y1="345" x2="320" y2="385" stroke="#666" stroke-width="1.5"/>
          <line x1="320" y1="345" x2="280" y2="385" stroke="#666" stroke-width="1.5"/>
        </g>
        <!-- 后轮轮毂 -->
        <circle cx="300" cy="365" r="4" fill="#888"/>

        <!-- 前轮 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 400 365;360 400 365" dur="0.8s" repeatCount="indefinite"/>
          <circle cx="400" cy="365" r="28" fill="none" stroke="#333" stroke-width="3"/>
          <line x1="400" y1="337" x2="400" y2="393" stroke="#666" stroke-width="1.5"/>
          <line x1="372" y1="365" x2="428" y2="365" stroke="#666" stroke-width="1.5"/>
          <line x1="380" y1="345" x2="420" y2="385" stroke="#666" stroke-width="1.5"/>
          <line x1="420" y1="345" x2="380" y2="385" stroke="#666" stroke-width="1.5"/>
        </g>
        <circle cx="400" cy="365" r="4" fill="#888"/>

        <!-- 车架 -->
        <line x1="300" y1="365" x2="345" y2="330" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
        <line x1="345" y1="330" x2="400" y2="365" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
        <line x1="345" y1="330" x2="350" y2="340" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
        <line x1="300" y1="365" x2="350" y2="340" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
        <!-- 座管 -->
        <line x1="340" y1="335" x2="335" y2="315" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
        <!-- 座垫 -->
        <ellipse cx="335" cy="313" rx="14" ry="5" fill="#2C3E50"/>
        <!-- 车头管 -->
        <line x1="390" y1="340" x2="395" y2="310" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round"/>
        <!-- 车把 -->
        <line x1="385" y1="308" x2="408" y2="305" stroke="#333" stroke-width="3" stroke-linecap="round"/>
        <!-- 车把手 -->
        <circle cx="385" cy="308" r="3" fill="#333"/>
        <circle cx="408" cy="305" r="3" fill="#333"/>

        <!-- 链条区域 - 牙盘 -->
        <circle cx="350" cy="340" r="10" fill="none" stroke="#666" stroke-width="2"/>
        <circle cx="350" cy="340" r="3" fill="#888"/>

        <!-- 踏板曲柄 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 350 340;360 350 340" dur="0.8s" repeatCount="indefinite"/>
          <line x1="350" y1="340" x2="350" y2="358" stroke="#555" stroke-width="3"/>
          <line x1="350" y1="340" x2="350" y2="322" stroke="#555" stroke-width="3"/>
          <!-- 踏板 -->
          <rect x="344" y="356" width="12" height="4" rx="2" fill="#555"/>
          <rect x="344" y="320" width="12" height="4" rx="2" fill="#555"/>
        </g>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <g>
        <!-- 身体 -->
        <ellipse cx="345" cy="290" rx="30" ry="22" fill="#F5F5DC">
          <animate attributeName="ry" values="22;23;22" dur="0.6s" repeatCount="indefinite"/>
        </ellipse>

        <!-- 翅膀 -->
        <g>
          <path d="M325 280 Q300 260 310 290 Q320 300 330 295" fill="#D2C6A5" stroke="#C4B896" stroke-width="1">
            <animate attributeName="d"
              values="M325 280 Q300 260 310 290 Q320 300 330 295;M325 280 Q295 255 308 288 Q318 302 330 295;M325 280 Q300 260 310 290 Q320 300 330 295"
              dur="0.8s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- 尾巴 -->
        <path d="M315 295 Q300 300 295 290 Q290 285 298 282" fill="#D2C6A5" stroke="#C4B896" stroke-width="1">
          <animate attributeName="d"
            values="M315 295 Q300 300 295 290 Q290 285 298 282;M315 295 Q298 303 292 293 Q288 287 296 280;M315 295 Q300 300 295 290 Q290 285 298 282"
            dur="1s" repeatCount="indefinite"/>
        </path>

        <!-- 脖子 -->
        <path d="M365 278 Q375 260 378 245 Q380 230 375 215" fill="none" stroke="#F5F5DC" stroke-width="12" stroke-linecap="round">
          <animate attributeName="d"
            values="M365 278 Q375 260 378 245 Q380 230 375 215;M365 278 Q377 258 380 242 Q382 228 378 213;M365 278 Q375 260 378 245 Q380 230 375 215"
            dur="1.2s" repeatCount="indefinite"/>
        </path>
        <!-- 脖子轮廓线 -->
        <path d="M365 278 Q375 260 378 245 Q380 230 375 215" fill="none" stroke="#E8DCC8" stroke-width="13" stroke-linecap="round" opacity="0.3">
          <animate attributeName="d"
            values="M365 278 Q375 260 378 245 Q380 230 375 215;M365 278 Q377 258 380 242 Q382 228 378 213;M365 278 Q375 260 378 245 Q380 230 375 215"
            dur="1.2s" repeatCount="indefinite"/>
        </path>

        <!-- 头部 -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0,0;2,-2;0,0" dur="1.2s" repeatCount="indefinite"/>

          <!-- 头 -->
          <ellipse cx="378" cy="210" rx="16" ry="14" fill="#F5F5DC"/>

          <!-- 眼睛 -->
          <circle cx="386" cy="206" r="4" fill="white"/>
          <circle cx="387" cy="206" r="2.5" fill="#1a1a1a"/>
          <circle cx="388" cy="205" r="1" fill="white"/>

          <!-- 眼周圈 -->
          <circle cx="386" cy="206" r="5" fill="none" stroke="#D2C6A5" stroke-width="0.8"/>

          <!-- 上喙 -->
          <path d="M392 212 L430 215 L428 220 Q410 218 392 218Z" fill="#F4A460" stroke="#E08840" stroke-width="0.5"/>

          <!-- 下喙 + 喉囊 (鹈鹕标志性特征!) -->
          <path d="M392 218 L428 220 L425 224 Q415 235 405 238 Q395 235 392 225Z"
                fill="#FFB366" stroke="#E08840" stroke-width="0.5" opacity="0.9">
            <animate attributeName="d"
              values="M392 218 L428 220 L425 224 Q415 235 405 238 Q395 235 392 225Z;M392 218 L428 220 L425 226 Q415 240 405 244 Q395 240 392 225Z;M392 218 L428 220 L425 224 Q415 235 405 238 Q395 235 392 225Z"
              dur="2s" repeatCount="indefinite"/>
          </path>

          <!-- 喙尖钩 -->
          <path d="M428 215 Q433 217 430 220" fill="none" stroke="#CC7030" stroke-width="1.5" stroke-linecap="round"/>

          <!-- 头顶羽毛 -->
          <path d="M370 200 Q368 190 372 195" fill="none" stroke="#D2C6A5" stroke-width="2" stroke-linecap="round"/>
          <path d="M374 198 Q373 187 376 192" fill="none" stroke="#D2C6A5" stroke-width="2" stroke-linecap="round"/>
          <path d="M378 197 Q378 186 381 191" fill="none" stroke="#D2C6A5" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- 腿 (蹬踏板动作) -->
        <!-- 左腿 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 350 340;360 350 340" dur="0.8s" repeatCount="indefinite"/>
          <line x1="350" y1="322" x2="348" y2="310" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
          <!-- 脚掌 -->
          <path d="M344 320 L356 320 L358 324 L342 324Z" fill="#F4A460"/>
        </g>
        <!-- 右腿 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="180 350 340;540 350 340" dur="0.8s" repeatCount="indefinite"/>
          <line x1="350" y1="322" x2="348" y2="310" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
          <path d="M344 320 L356 320 L358 324 L342 324Z" fill="#F4A460"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 路边小树 -->
  <g>
    <rect x="580" y="340" width="8" height="30" fill="#8B6914" rx="2"/>
    <ellipse cx="584" cy="330" rx="20" ry="22" fill="#3A7A2A"/>
    <ellipse cx="575" cy="338" rx="15" ry="16" fill="#4A8A3A"/>
    <ellipse cx="595" cy="335" rx="14" ry="15" fill="#3A7A2A"/>
  </g>
  <g>
    <rect x="130" y="345" width="6" height="25" fill="#8B6914" rx="2"/>
    <ellipse cx="133" cy="338" rx="16" ry="18" fill="#3A7A2A"/>
    <ellipse cx="125" cy="343" rx="12" ry="13" fill="#4A8A3A"/>
    <ellipse cx="143" cy="340" rx="11" ry="12" fill="#3A7A2A"/>
  </g>

  <!-- 路边花朵 -->
  <g>
    <circle cx="490" cy="365" r="4" fill="#FF69B4"/>
    <circle cx="490" cy="365" r="2" fill="#FFD700"/>
    <line x1="490" y1="369" x2="490" y2="380" stroke="#228B22" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="200" cy="366" r="3.5" fill="#FF6347"/>
    <circle cx="200" cy="366" r="1.8" fill="#FFD700"/>
    <line x1="200" y1="370" x2="200" y2="378" stroke="#228B22" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="700" cy="364" r="4" fill="#DA70D6"/>
    <circle cx="700" cy="364" r="2" fill="#FFD700"/>
    <line x1="700" y1="368" x2="700" y2="379" stroke="#228B22" stroke-width="1.5"/>
  </g>

  <!-- 标题文字 -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFF" font-weight="bold" opacity="0.8">
    🚲 鹈鹕骑行中... Pelican Cycling! 🐦
  </text>
</svg>
</body>
</html>
